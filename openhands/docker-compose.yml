services:
  openhands:
    image: ghcr.io/all-hands-ai/openhands:0.17
    container_name: openhands-godmode
    pull_policy: always
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPENHANDS_PORT:-3000}:3000"
    environment:
      - SANDBOX_RUNTIME_CONTAINER_IMAGE=docker.openhands.dev/all-hands-ai/runtime:latest
      - LOG_ALL_EVENTS=true
      - WORKSPACE_MOUNT_PATH=/opt/workspace_base
      - LLM_MODEL=${OPENHANDS_LLM_MODEL:-smart-router}
      - LLM_API_KEY=${OPENHANDS_LLM_API_KEY:-${LITELLM_API_KEY:-}}
      - LLM_BASE_URL=${OPENHANDS_LLM_BASE_URL:-http://litellm-godmode:4000}
      - FILE_STORE=${OPENHANDS_FILE_STORE:-local}
      - FILE_STORE_PATH=${OPENHANDS_FILE_STORE_PATH:-/.openhands-state}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    volumes:
      - ./workspace:/opt/workspace_base
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.openhands-state:/.openhands-state
      - ./healthcheck.py:/opt/godmode/healthcheck.py:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - core
    healthcheck:
      test: ["CMD", "python", "/opt/godmode/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  openhands-adapter:
    image: python:3.11-slim
    container_name: openhands-godmode-adapter
    restart: unless-stopped
    working_dir: /app
    ports:
      - "127.0.0.1:${OPENHANDS_ADAPTER_PORT:-3001}:3001"
    environment:
      - OPENHANDS_PUBLIC_URL=${OPENHANDS_PUBLIC_URL:-http://localhost:3000}
      - OPENHANDS_API_URL=${OPENHANDS_API_INTERNAL_URL:-http://openhands-godmode:3000}
      - OPENHANDS_TRIGGER_URL=${OPENHANDS_TRIGGER_URL:-}
      - OPENHANDS_API_KEY=${OPENHANDS_API_KEY}
      - OPENHANDS_ADAPTER_PORT=${OPENHANDS_ADAPTER_PORT:-3001}
      - DEVTOOLS_BRIDGE_URL=${DEVTOOLS_BRIDGE_URL:-http://host.docker.internal:3911}
      - DEVTOOLS_BRIDGE_TIMEOUT=${DEVTOOLS_BRIDGE_TIMEOUT:-900}
      - GITHUB_REPO_URL=${GITHUB_REPO_URL:-https://github.com/strazzusochr/CoronaProjektschonwieder}
      - GODMODE_SOURCE=${GODMODE_SOURCE:-godmode_setup}
    volumes:
      - ./adapter.py:/app/adapter.py:ro
      - ./adapter_requirements.txt:/app/requirements.txt:ro
      - ./workspace:/app/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - core
    command: >
      sh -lc "pip install --no-cache-dir -r requirements.txt &&
      uvicorn adapter:app --host 0.0.0.0 --port ${OPENHANDS_ADAPTER_PORT:-3001}"
    depends_on:
      openhands:
        condition: service_healthy

networks:
  core:
    external: true
    name: ${GODMODE_CORE_NETWORK:-godmode_core}
