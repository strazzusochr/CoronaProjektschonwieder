services:
  bolt-facade:
    image: python:3.11-slim
    container_name: bolt-facade-godmode
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BOLTDIY_FACADE_PORT:-3901}:3901"
    environment:
      - PYTHONUNBUFFERED=1
      - GODMODE_REPO_ROOT=/workspace
      - BOLTDIY_MODE=${BOLTDIY_MODE:-hybrid}
      - BOLTDIY_FORWARD_TIMEOUT=${BOLTDIY_FORWARD_TIMEOUT:-20}
      - BOLTDIY_SPACE_URL=${BOLTDIY_SPACE_URL:-https://huggingface.co/spaces/Wrzzzrzr/bolt-diy-godmode}
      - BOLTDIY_SPACE_ID=${BOLTDIY_SPACE_ID:-Wrzzzrzr/bolt-diy-godmode}
      - HF_TOKEN=${HF_TOKEN:-}
      - BOLTDIY_SPACE_TOKEN=${BOLTDIY_SPACE_TOKEN:-}
      - HF_AIDER_SPACE_URL=${HF_AIDER_SPACE_URL:-}
      - HF_SMOLAGENTS_SPACE_URL=${HF_SMOLAGENTS_SPACE_URL:-}
      - HF_AIDER_URL=${HF_AIDER_URL:-}
      - HF_AIDER_DISPATCH_URL=${HF_AIDER_DISPATCH_URL:-}
      - SMOLAGENTS_URL=${SMOLAGENTS_URL:-}
      - SMOLAGENTS_DISPATCH_URL=${SMOLAGENTS_DISPATCH_URL:-}
      - LANGGRAPH_API_URL=${LANGGRAPH_API_URL:-}
      - LANGGRAPH_API_INTERNAL_URL=${LANGGRAPH_API_INTERNAL_URL:-http://langgraph-godmode-local:8080}
      - OLLAMAHF_BASE_URL=${OLLAMAHF_BASE_URL:-https://cgjgj-ollamahftrae.hf.space}
      - OLLAMAHF_MASTER_KEY=${OLLAMAHF_MASTER_KEY:-}
      - OLLAMAHF_BEARER_TOKEN=${OLLAMAHF_BEARER_TOKEN:-}
      - ZERO_COMPUTE_POLICY=${ZERO_COMPUTE_POLICY:-true}
      - GODMODE_ALLOW_LOCAL_HEAVY=${GODMODE_ALLOW_LOCAL_HEAVY:-false}
      - AGENT_REGISTRY_PATH=/workspace/agent_registry.json
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_INTERNAL_URL:-http://n8n-godmode:5678/webhook/godmodeMissionTrigger01/mission-webhook/godmode-mission}
      - OPENHANDS_ADAPTER_URL=${OPENHANDS_ADAPTER_INTERNAL_URL:-http://openhands-godmode-adapter:3001}
      - OPENHANDS_INTERNAL_URL=${OPENHANDS_INTERNAL_URL:-http://openhands-godmode:3000}
      - OPENHANDS_PUBLIC_URL=${OPENHANDS_PUBLIC_URL:-}
      - OPENHANDS_LLM_MODEL=${OPENHANDS_LLM_MODEL:-smart-router}
      - OPENHANDS_LLM_BASE_URL=${OPENHANDS_LLM_BASE_URL:-http://litellm-godmode:4000}
      - OPENHANDS_LLM_API_KEY=${OPENHANDS_LLM_API_KEY:-replace-with-litellm-key}
      - LITELLM_API_KEY=${LITELLM_API_KEY:-}
      - LITELLM_URL=${LITELLM_URL:-http://litellm-godmode:4000}
      - LITELLM_PORT=${LITELLM_PORT:-4000}
      - BOOTSTRAP_ALLOW_SCRIPT_START=${BOOTSTRAP_ALLOW_SCRIPT_START:-false}
      - BOOTSTRAP_START_SCRIPT=${BOOTSTRAP_START_SCRIPT:-}
      - BOOTSTRAP_COMMAND_TIMEOUT=${BOOTSTRAP_COMMAND_TIMEOUT:-900}
      - N8N_MEMORY_PROBE_URL=${N8N_MEMORY_PROBE_URL:-}
      - BOLTDIY_FACADE_INTERNAL_URL=${BOLTDIY_FACADE_INTERNAL_URL:-http://bolt-facade-godmode:3901}
      - MEMORY_VAULT_PATH=/workspace/memory_vault.md
      - FINAL_PROOF_PATH=/workspace/FINAL_PROOF.md
      - GODMODE_GOAL_PATH=/workspace/GODMODE_GOAL.md
      - BOLTDIY_RUNTIME_DIR=/workspace/runtime/bolt_facade
      - GODMODE_EVIDENCE_DIR=/workspace/runtime/evidence
    volumes:
      - ./app.py:/app/app.py:ro
      - ./requirements.txt:/app/requirements.txt:ro
      - ../agent_registry.json:/workspace/agent_registry.json:ro
      - ../memory_vault.md:/workspace/memory_vault.md
      - ../FINAL_PROOF.md:/workspace/FINAL_PROOF.md
      - ../GODMODE_GOAL.md:/workspace/GODMODE_GOAL.md
      - ../.godmode_runtime:/workspace/runtime
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - core
    command: >
      sh -lc "pip install --no-cache-dir -r /app/requirements.txt &&
      uvicorn app:app --host 0.0.0.0 --port 3901 --app-dir /app"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3901/health', timeout=5).status==200 else 1)"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  core:
    external: true
    name: ${GODMODE_CORE_NETWORK:-godmode_core}
