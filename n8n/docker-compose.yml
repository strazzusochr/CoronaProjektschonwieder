services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-godmode
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=${N8N_WEBHOOK_BASE_URL:-http://localhost:5678/}
      - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL:-http://localhost:5678}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - HF_TOKEN=${HF_TOKEN}
      - OPENHANDS_API_URL=${OPENHANDS_API_INTERNAL_URL:-http://openhands-godmode:3000}
      - OPENHANDS_API_KEY=${OPENHANDS_API_KEY}
      - OPENHANDS_ADAPTER_URL=${OPENHANDS_ADAPTER_INTERNAL_URL:-http://openhands-godmode-adapter:3001}
      - BOLTDIY_FACADE_URL=${BOLTDIY_FACADE_INTERNAL_URL:-http://bolt-facade-godmode:3901}
      - LANGGRAPH_API_URL=${LANGGRAPH_API_INTERNAL_URL:-http://langgraph-godmode-local:8080}
      - MEMORY_VAULT_PATH=${MEMORY_VAULT_PATH:-/workspace/memory_vault.md}
      - NODE_FUNCTION_ALLOW_BUILTIN=fs,path
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_LOG_LEVEL=info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - core
    volumes:
      - n8n_data:/home/node/.n8n
      - ./backups:/backups
      - ../memory_vault.md:/workspace/memory_vault.md

volumes:
  n8n_data:

networks:
  core:
    external: true
    name: ${GODMODE_CORE_NETWORK:-godmode_core}
